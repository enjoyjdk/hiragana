<style>

*{box-sizing:border-box}

.stack{display:grid;gap:12px}
button{font-family:inherit}

button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:12px;background:var(--pinkbg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}

.hint{color:var(--sub);font-size:var(--tx)}
.q{font-size:var(--qk);font-weight:900;line-height:1.2;margin-top:4px;word-break:keep-all}
.spk{font-size:56px;border:0;background:var(--pinkbg);border-radius:50%;width:110px;height:110px;cursor:pointer;margin-top:6px}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:68px;padding:10px 14px;border:2px solid var(--line);background:var(--card);border-radius:18px;color:var(--ink);cursor:pointer;font-weight:700}
.opk{font-size:var(--ok)}.opr{font-size:var(--or)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row .big{min-height:60px;margin:0}
.score{font-size:3.2rem;font-weight:900;color:var(--pink);line-height:1.1}.st{font-size:2.4rem}.pct{font-size:1.5rem;font-weight:700}
#cv{display:block;width:100%;height:280px;background:#fff;border:3px dashed var(--pink);border-radius:22px;touch-action:none}
.ansk{color:var(--pink)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:3/4;font-size:clamp(22px,6.5vw,38px);font-weight:900;border:2px solid var(--line);border-radius:16px;background:var(--pinkbg);color:var(--ink);cursor:pointer;padding:0;word-break:keep-all}
.mc.up{background:var(--card)}.mc.hit{background:var(--mintbg);border-color:var(--mint)}
.sky{position:relative;height:min(58vh,440px);overflow:hidden;border-radius:24px;background:var(--sky);border:2px solid var(--line)}
.fl{position:absolute;top:-100px;width:auto;min-width:20%;white-space:nowrap;min-height:64px;font-size:min(var(--ok),9vw);font-weight:900;border:2px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);cursor:pointer;animation:fall linear infinite;padding:4px 6px}

.fl.nope{background:var(--redbg);border-color:var(--red)}

.sl{min-width:56px;height:64px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--ok);font-weight:900;border-bottom:4px solid var(--pink);background:var(--card);border-radius:12px}

.kc:disabled{opacity:.25}
.big{display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.big .ic{font-size:2.6rem;line-height:1}.big .lb{font-size:1.55rem;font-weight:900;text-align:left}.big .lb small{display:block;font-size:.55em;font-weight:500;color:var(--sub)}
.row .big{font-size:1.35rem}.big.sk{background:var(--sky)}
.big:active,.opt:active:not(:disabled),.kc:active,.mc:active{transform:scale(.95)}
.opt,.kc,.mc{box-shadow:0 3px 0 var(--line)}
.dc{display:inline-block;animation:wig 3s ease-in-out infinite}@keyframes wig{50%{transform:rotate(14deg) scale(1.15)}}
.mean{font-size:calc(var(--tx)*.9);color:var(--sub);margin-top:6px}
.pop{display:inline-block;font-size:2rem;animation:bnc .6s}@keyframes bnc{0%{transform:scale(0)}60%{transform:scale(1.4) rotate(12deg)}100%{transform:scale(1)}}
.st{animation:bnc .8s}

.field{position:relative}.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.hole{position:relative;aspect-ratio:1/1;overflow:hidden;cursor:pointer;touch-action:manipulation;border-radius:18px;background:var(--sky)}

.sp{position:absolute;pointer-events:none;z-index:7;animation:burst .7s ease-out forwards}@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

.sky{background:linear-gradient(#cfeeff,#f3fbff 62%,#ffeef4)}

.field{background:linear-gradient(#cdeeff 0 28%,#bfe9a6 28% 100%);border-radius:24px;padding:16px 10px 10px;overflow:hidden}

.hole{background:transparent;aspect-ratio:1/1.12}

.mole{display:block;left:10%;right:10%;bottom:18%;height:80%;background:#c9a07c;border:3px solid #a87d58;border-radius:50% 50% 26% 26%;font-size:inherit}

.mf{position:absolute;top:8%;left:0;right:0;height:30%}.mole.up .mf{animation:bob 1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(3px)}}

.ns{position:absolute;top:40%;left:50%;width:14px;height:9px;margin-left:-7px;border-radius:50%;background:#ff8fab}
.mk{position:absolute;left:4%;right:4%;bottom:19%;background:#fff;color:#4b3a3f;border:3px solid var(--pink);border-radius:16px;text-align:center;font-size:min(var(--ok),9vw);font-weight:900;line-height:1.05;padding:0}

.hammer{font-size:4rem}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:30s!important}}

  const it=sh([t,...dist(pool,t,3)]);
  sky.innerHTML=it.map((x,k)=>`<button class="fl" style="left:${k*25+rnd(3)}%;animation-duration:${9+rnd(4)}s;animation-delay:-${rnd(8)}s">${x.k}</button>`).join('')};
 sky.onclick=e=>{const b=e.target.closest('.fl');if(!b)return;
  if(b.textContent===t.k){sfx(1);n++;$('#n').textContent=n;const f=sky.getBoundingClientRect(),r=b.getBoundingClientRect(),cx=r.left-f.left+r.width/2,cy=r.top-f.top+r.height/2;n>=10?gameEnd('10 / 10','clr',again,bk,1):(round(),fx(sky,cx,cy,['⭐','🌸','✨']))}
  else{sfx(0);b.classList.add('nope');later(()=>b.classList.remove('nope'),400)}};
 round()}
function gWhack(rk){const bk=()=>gRange(4),again=()=>gWhack(rk),pool=GP(rk);let n=0,t=pool[rnd(pool.length)],sid=0,done=0;const hs=Array(6).fill(null);
 go(`<div class="top"><span>${L('g4')}</span><span>⭐ <b id="n">0</b> / 10</span></div><div class="card"><div class="hint">${L('w4h')}</div><div class="q" id="tg">${t.d}</div></div>
 <div class="field" id="fd"><div class="holes">${hs.map(()=>'<div class="hole"><div class="mole"><div class="mf"><i class="ey"></i><i class="ey"></i><i class="ns"></i></div><div class="mk"></div></div><div class="mound"></div></div>').join('')}</div><div class="hammer" id="hmr">🔨</div></div>`,bk);
 const el=[...app.querySelectorAll('.hole')],mo=el.map(h=>h.querySelector('.mole')),fd=$('#fd'),hmr=$('#hmr');
 const hide=i=>{hs[i]=null;mo[i].classList.remove('up')};
 const show=(i,c)=>{const id=++sid;hs[i]={c,id};mo[i].querySelector('.mk').textContent=c.k;mo[i].classList.remove('nope','ouch');mo[i].classList.add('up');later(()=>{if(hs[i]&&hs[i].id===id)hide(i)},MOLE_ANIM_MS+MOLE_UP_MS)};
 const spawn=()=>{const free=hs.map((x,i)=>x?-1:i).filter(i=>i>=0),up=hs.filter(Boolean),hasT=up.some(x=>x.c.k===t.k);
  if(!free.length||(up.length>=4&&hasT))return;
  const c=(!hasT||Math.random()<.3)?t:pool.filter(x=>x.d!==t.d)[rnd(pool.length-1)];show(free[rnd(free.length)],c)};
 const loop=()=>later(()=>{spawn();loop()},650);spawn();loop();
 const at=h=>{const f=fd.getBoundingClientRect(),r=h.getBoundingClientRect();return[r.left-f.left+r.width/2,r.top-f.top+r.height*.35]};
 const swing=h=>{const[x,y]=at(h);hmr.style.left=x+'px';hmr.style.top=y+'px';hmr.classList.remove('hit');void hmr.offsetWidth;hmr.classList.add('hit')};
 const stars=h=>{const[x,y]=at(h);fd.insertAdjacentHTML('beforeend',[0,1,2,3,4].map(k=>`<span class="sp" style="left:${x}px;top:${y}px;--dx:${Math.round(Math.cos(k*1.26)*55)}px;--dy:${Math.round(Math.sin(k*1.26)*55-10)}px;font-size:1.4rem">${k%2?'⭐':'✨'}</span>`).join(''));later(()=>fd.querySelectorAll('.sp').forEach(e=>e.remove()),800)};
 el.forEach((h,i)=>h.onpointerdown=e=>{e.preventDefault();const s=hs[i];if(done||!s)return;swing(h);
  if(s.c.k===t.k){sfx(1);stars(h);hs[i]=null;mo[i].classList.add('ouch');later(()=>{if(!hs[i])mo[i].classList.remove('up')},260);n++;$('#n').textContent=n;
   if(n>=10){done=1;later(()=>gameEnd('10 / 10','clr',again,bk,1),600);return}
   t=pool.filter(x=>x.d!==t.d)[rnd(pool.length-1)];$('#tg').textContent=t.d}
  else{sfx(0);mo[i].classList.add('nope');later(()=>{if(hs[i]&&hs[i].id===s.id)hide(i)},350)}})}
function gBuild(){const bk=gameMenu,again=gBuild,ws=sh(WD.filter(w=>w.k.length<=4)).slice(0,10);let i=0,bad=0;
 const draw=()=>{const w=ws[i],ch=[...w.k],ex=sh(CH.s).map(x=>x.k).filter(x=>!ch.includes(x)).slice(0,2),cards=sh([...ch,...ex]);let ans=[],done=0,mis=0;
  go(`<div class="top"><span>${i+1} / 10</span><span></span></div><div class="bar"><i style="width:${i*10}%"></i></div><div class="card"><div class="hint">${L('bh')}</div><div class="q" style="font-size:calc(var(--qk)*${fs(w.r.length)})">${w.r}</div><div class="mean">${w.e}</div></div>
  <div class="slots" id="sl"></div><div class="cards">${cards.map((c,k)=>`<button class="kc" data-k="${k}">${c}</button>`).join('')}</div>
  <div class="row"><button class="big" id="un">${L('un')}</button><button class="big" id="ca">${L('ca')}</button></div><div id="fb"></div>`,bk);
  const kc=[...app.querySelectorAll('.kc')],paint=()=>{$('#sl').innerHTML=ans.map(k=>`<span class="sl">${cards[k]}</span>`).join('')+'<span class="sl">&nbsp;</span>'.repeat(ch.length-ans.length);kc.forEach((b,k)=>b.disabled=ans.includes(k));$('#fb').innerHTML=''};
  paint();
  kc.forEach((b,k)=>b.onclick=()=>{if(done||ans.length>=ch.length||ans.includes(k))return;ans.push(k);paint();
   if(ans.length===ch.length){if(ans.map(z=>cards[z]).join('')===w.k){done=1;sfx(1);{const q=$('#sl');fx(q,q.clientWidth/2,28,['🌸','⭐','✨'])}$('#fb').innerHTML=`<div class="fb ok"><b>⭕ ${L('ok')}</b>${w.k}</div><button class="big main" id="nx">${L(i===9?'fin':'next')}</button>`;const nx=$('#nx');nx.onclick=()=>{if(nx.dataset.d)return;nx.dataset.d=1;i++;i>=10?gameEnd(`${L('ff')}: ${10-bad} / 10`,bad?'r4':'perfect',again,bk,!bad):draw()}}
    else{sfx(0);if(!mis){mis=1;bad++}$('#fb').innerHTML=`<div class="fb ng"><b>❌</b>${L('wrong')}</div>`}}});
  $('#un').onclick=()=>{if(!done){ans.pop();paint()}};$('#ca').onclick=()=>{if(!done){ans=[];paint()}}};
 draw()}
labels();home();
</script></body></html>
